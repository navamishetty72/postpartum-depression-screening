name: CI Test Suite

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Deterministic Synthetic Multimodal Datasets and Baselines
      run: |
        python pipelines/generate_synthetic_multimodal.py
        python -m pipelines.synthetic_audio.train_audio_model
        python -m pipelines.synthetic_text.train_text_model

    - name: Run Pytest Test Suite
      run: |
        python -m pytest -v
